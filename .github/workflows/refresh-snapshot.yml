name: refresh offline snapshot

# data/snapshot.json（加密貨幣）與 data/us/*.json（美股／ETF）是內建資料：
# 前者是連不上交易所時的備援，後者是美股主流標的的主力來源，所以每天重跑一次。
# 只有真的有新資料時才提交。
#
# 為什麼 CI 抓得到美股：快照取自 Yahoo Finance，它對瀏覽器沒有 CORS 標頭，
# 但從伺服器端（這裡）抓完全沒問題。
on:
  schedule:
    - cron: "23 3 * * *"      # 每天 03:23 UTC（台北 11:23）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 更新加密貨幣備援資料
        run: node scripts/build-snapshot.mjs
        continue-on-error: true

      - name: 更新美股／ETF 內建快照
        run: node scripts/build-us-snapshot.mjs

      - name: 驗證新資料
        run: node test/us-snapshot.test.mjs

      - name: 有變更才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "沒有變更，略過提交"
          else
            git commit -m "chore: refresh offline price snapshot"
            git push
          fi
