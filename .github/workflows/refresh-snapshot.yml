name: refresh offline snapshot

# data/snapshot.json 是「連不上交易所時的離線備援資料」。
# 它會隨時間越來越舊，所以每月重跑一次，而且只在真的有新資料時才提交。
on:
  schedule:
    - cron: "23 3 1 * *"      # 每月 1 日 03:23 UTC（台北 11:23）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 重新抓取備援日線
        run: node scripts/build-snapshot.mjs

      - name: 有變更才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --cached --quiet; then
            echo "沒有變更，略過提交"
          else
            git commit -m "chore: refresh offline price snapshot"
            git push
          fi
